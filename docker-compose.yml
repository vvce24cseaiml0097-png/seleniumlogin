
services:

  chrome:
    image: selenium/standalone-chrome:latest

    shm_size: "2gb"

    ports:
      - "4444:4444"
      - "7900:7900"

    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:4444/status | grep -q ready"]
      interval: 5s
      timeout: 5s
      retries: 30

  web:
    image: nginx:alpine

    volumes:
      - ./src/test/java/webpage:/usr/share/nginx/html:ro

    ports:
      - "8080:80"

    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost/login.html"]
      interval: 5s
      timeout: 3s
      retries: 10

  tests:
    build: .

    depends_on:
      chrome:
        condition: service_healthy

      web:
        condition: service_healthy

    environment:
      SELENIUM_REMOTE_URL: http://chrome:4444
      BASE_URL: http://web/login.html
