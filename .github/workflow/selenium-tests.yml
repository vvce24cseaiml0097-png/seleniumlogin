
name: Selenium Login Tests

on:
  push:
    branches: [ "main" ]

  pull_request:
    branches: [ "main" ]

jobs:
  selenium-tests:

    runs-on: ubuntu-latest

    env:
      HEADLESS: "true"

    steps:

      - name: Checkout project
        uses: actions/checkout@v7

      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Run Selenium Tests
        run: mvn --batch-mode clean test
